<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conectar flores</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{font-family:Arial,Helvetica,sans-serif;padding:16px;text-align:center;color:#eae6cf;background:linear-gradient(180deg,#23382f 0%,#1c2f2b 55%,#17272a 100%) fixed}
h1{font-size:1.3rem;margin:0 0 6px}
p{margin:4px 0}
canvas{touch-action:none;background:#16251f;border:3px solid #3d5c4c;border-radius:16px;box-shadow:0 6px 18px rgba(0,0,0,.35);max-width:100%;margin:10px 0}
button{font:inherit;color:#eae6cf;background:#2c4a3c;border:2px solid #5f8f73;border-radius:999px;padding:8px 16px;margin:0 4px;cursor:pointer}
button:active{background:#3a5f4c}
#msg{min-height:1.4em;font-weight:bold}
#nx{display:none}
.foot{margin-top:22px;font-size:.85rem;color:#a9b8a8}
</style>
</head>
<body>
<h1>Conectar flores</h1>
<p>Une las flores del mismo color y llena todo el tablero.</p>
<p>Nivel: <span id="lv">1</span> | Unidas: <span id="cn">0/0</span> | Lleno: <span id="fl">0%</span></p>
<canvas id="cv"></canvas>
<p id="msg"></p>
<div>
  <button id="rs">Reiniciar</button>
  <button id="nw">Otro tablero</button>
  <button id="nx">Siguiente nivel</button>
</div>
<p class="foot">Hecho por ing Laly</p>
<script>
(function(){
  var COLORS=['#ff6b6b','#5b9bff','#4cd964','#ffb340','#c77dff','#2ed1c6'];
  var SIZES=[4,5,5,6,6,7];
  var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  var n,k,N,dots,paths,occ,cols,cur=-1,level=1,done=false,S=300,cs=75,DPR=window.devicePixelRatio||1,lastP=null;

  function nb(i){var r=Math.floor(i/n),c=i%n,o=[];if(r>0)o.push(i-n);if(r<n-1)o.push(i+n);if(c>0)o.push(i-1);if(c<n-1)o.push(i+1);return o;}

  function genPath(){
    var T=n*n;
    for(var a=0;a<300;a++){
      var start=Math.floor(Math.random()*T),vis=new Array(T).fill(false),path=[start],steps=0;
      vis[start]=true;
      var go=function(i){
        if(path.length===T)return true;
        if(++steps>30000)return false;
        var cand=nb(i).filter(function(x){return !vis[x];}).map(function(x){
          var dg=nb(x).filter(function(y){return !vis[y];}).length;return [dg+Math.random()*0.9,x];
        }).sort(function(p,q){return p[0]-q[0];});
        for(var j=0;j<cand.length;j++){
          var x=cand[j][1];vis[x]=true;path.push(x);
          if(go(x))return true;
          if(steps>30000)return false;
          vis[x]=false;path.pop();
        }
        return false;
      };
      if(go(start))return path;
    }
    var p=[];for(var r=0;r<n;r++)for(var c=0;c<n;c++)p.push(r*n+(r%2?n-1-c:c));return p;
  }

  function newBoard(){
    n=SIZES[Math.min(level-1,SIZES.length-1)];k=n-1;N=n*n;
    var path=genPath(),len=[],i;
    for(i=0;i<k;i++)len.push(3);
    var rem=N-3*k;while(rem-->0)len[Math.floor(Math.random()*k)]++;
    cols=COLORS.slice(0,k).sort(function(){return Math.random()-.5;});
    dots={};var pos=0;
    for(i=0;i<k;i++){dots[path[pos]]=i;dots[path[pos+len[i]-1]]=i;pos+=len[i];}
    reset();
  }
  function reset(){
    paths=[];for(var i=0;i<k;i++)paths.push([]);
    cur=-1;done=false;
    document.getElementById('nx').style.display='none';
    document.getElementById('msg').textContent='';
    rebuild();resize();update();
  }
  function rebuild(){occ=new Array(N).fill(-1);paths.forEach(function(p,i){p.forEach(function(c){occ[c]=i;});});}
  function complete(i){var p=paths[i];return p.length>1&&dots[p[0]]===i&&dots[p[p.length-1]]===i&&p[0]!==p[p.length-1];}

  function resize(){
    S=Math.max(240,Math.min(window.innerWidth-32,440,window.innerHeight-300));
    cs=S/n;cv.style.width=S+'px';cv.style.height=S+'px';cv.width=S*DPR;cv.height=S*DPR;draw();
  }
  window.addEventListener('resize',resize);

  function xy(c){return [(c%n+.5)*cs,(Math.floor(c/n)+.5)*cs];}

  function draw(){
    ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,S,S);
    var i,c;
    ctx.strokeStyle='#3f5f50';ctx.lineWidth=1;
    for(i=0;i<=n;i++){
      ctx.beginPath();ctx.moveTo(i*cs,0);ctx.lineTo(i*cs,S);ctx.stroke();
      ctx.beginPath();ctx.moveTo(0,i*cs);ctx.lineTo(S,i*cs);ctx.stroke();
    }
    ctx.lineCap='round';ctx.lineJoin='round';
    for(i=0;i<k;i++){
      var p=paths[i];if(p.length<2)continue;
      ctx.strokeStyle=cols[i];ctx.lineWidth=cs*.3;
      ctx.beginPath();p.forEach(function(q,j){var a=xy(q);if(j)ctx.lineTo(a[0],a[1]);else ctx.moveTo(a[0],a[1]);});
      ctx.stroke();
    }
    for(c in dots){
      var a=xy(+c),r=cs*.3,t;
      ctx.fillStyle=cols[dots[c]];
      for(t=0;t<6;t++){var g=t*Math.PI/3;ctx.beginPath();ctx.arc(a[0]+Math.cos(g)*r*.55,a[1]+Math.sin(g)*r*.55,r*.45,0,7);ctx.fill();}
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(a[0],a[1],r*.35,0,7);ctx.fill();
      ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.stroke();
    }
  }

  function update(){
    var cn=0,i,f=0;for(i=0;i<k;i++)if(complete(i))cn++;
    for(i=0;i<N;i++)if(occ[i]>=0)f++;
    document.getElementById('lv').textContent=level;
    document.getElementById('cn').textContent=cn+'/'+k;
    document.getElementById('fl').textContent=Math.round(f/N*100)+'%';
    return cn===k&&f===N;
  }

  function cellAt(fx,fy){var c=Math.floor(fx),r=Math.floor(fy);if(c<0||r<0||c>=n||r>=n)return -1;return r*n+c;}
  function frac(e){var b=cv.getBoundingClientRect();return [(e.clientX-b.left)/b.width*n,(e.clientY-b.top)/b.height*n];}

  function start(c){
    if(dots[c]!==undefined){cur=dots[c];paths[cur]=[c];}
    else if(occ[c]>=0){cur=occ[c];var p=paths[cur];p.length=p.indexOf(c)+1;}
    else return;
    rebuild();
  }
  function step(c){
    var p=paths[cur],end=p[p.length-1];
    if(c===end)return false;
    var idx=p.indexOf(c);
    if(idx>=0){p.length=idx+1;return true;}
    if(complete(cur))return false;
    if(nb(end).indexOf(c)<0)return false;
    if(dots[c]!==undefined&&dots[c]!==cur)return false;
    if(occ[c]>=0&&occ[c]!==cur){var o=paths[occ[c]];o.length=o.indexOf(c);}
    p.push(c);return true;
  }
  function moveTo(c){
    var p=paths[cur],end=p[p.length-1];
    var dr=Math.floor(c/n)-Math.floor(end/n),dc=c%n-end%n,ok=false;
    if(Math.abs(dr)===1&&Math.abs(dc)===1){
      var m1=Math.floor(end/n)*n+c%n,m2=Math.floor(c/n)*n+end%n;
      if(step(m1)){ok=true;step(c);}else if(step(m2)){ok=true;step(c);}
    }else ok=step(c);
    if(ok)rebuild();
    return ok;
  }
  function finish(){
    if(update()&&!done){
      done=true;
      document.getElementById('msg').textContent='¡Nivel completado!';
      document.getElementById('nx').style.display='inline-block';
    }
  }

  cv.addEventListener('pointerdown',function(e){
    if(done)return;e.preventDefault();cv.setPointerCapture(e.pointerId);
    var f=frac(e),c=cellAt(f[0],f[1]);lastP=f;if(c<0)return;
    start(c);draw();update();
  });
  cv.addEventListener('pointermove',function(e){
    if(cur<0||done)return;e.preventDefault();
    var f=frac(e),dx=f[0]-lastP[0],dy=f[1]-lastP[1],steps=Math.max(1,Math.ceil(Math.hypot(dx,dy)/.2));
    for(var s=1;s<=steps;s++){
      var c=cellAt(lastP[0]+dx*s/steps,lastP[1]+dy*s/steps);
      if(c>=0)moveTo(c);
    }
    lastP=f;draw();update();
  });
  function up(){if(cur>=0){cur=-1;draw();finish();}}
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

  document.getElementById('rs').onclick=reset;
  document.getElementById('nw').onclick=newBoard;
  document.getElementById('nx').onclick=function(){level++;newBoard();};

  newBoard();
})();
</script>
</body>
</html>
